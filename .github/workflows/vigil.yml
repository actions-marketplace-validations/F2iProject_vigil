# This repository's caller for the centrally maintained Vigil workflow.
# Other F2iLLC repositories can use the same stub with:
#   uses: F2iLLC/vigil/.github/workflows/reusable-vigil.yml@main

name: Vigil PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vigil:
    uses: ./.github/workflows/reusable-vigil.yml
    with:
      runner-json: '["self-hosted","linux","x64","ci-general"]'
    secrets: inherit
