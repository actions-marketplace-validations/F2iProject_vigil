[project]
name = "vigil"
version = "0.1.0"
description = "AI-powered, model-agnostic PR review tool"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "litellm>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
webhook = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Used by the release tooling (.github/scripts/check_action_inputs.py) and
    # by the documentation-contract tests. It was previously only present as a
    # transitive dependency, which would break both the moment that chain
    # changed.
    "pyyaml>=6.0",
]

[project.scripts]
vigil = "vigil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
